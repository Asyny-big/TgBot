[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
timezone = UTC
# 0001_initial, 0002_add_x — sortable and readable in review
file_template = %%(rev)s_%%(slug)s

# The DSN is built from the validated application settings in alembic/env.py.
# ALEMBIC_DATABASE_DSN overrides it (used by the test suite).
sqlalchemy.url =

[post_write_hooks]
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
