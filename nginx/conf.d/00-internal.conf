# =============================================================================
# Loopback-only status listener.
#
# Bound to 127.0.0.1 inside the container, so it is reachable by the Docker
# healthcheck and by nothing else — not from the host, not from another
# container, not from the internet. It answers without touching TLS or any
# upstream, which is exactly what a liveness probe should do: it reports that
# nginx itself is accepting connections, and does not turn a backend outage into
# an edge restart.
# =============================================================================

server {
    listen      127.0.0.1:8081;
    server_name _;
    access_log  off;

    location = /internal/health {
        default_type "text/plain";
        return       200 "ok\n";
    }

    location / {
        return 404;
    }
}
