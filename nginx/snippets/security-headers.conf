# =============================================================================
# Response headers sent to browsers.
#
# Included in *every* location on purpose. nginx's `add_header` does not merge:
# a location that declares one header replaces the whole inherited set, so
# relying on inheritance would silently drop these headers exactly where a
# Cache-Control is added. Explicit inclusion is verbose and correct.
#
# The Content-Security-Policy needs no 'unsafe-inline': the admin panel ships
# zero inline scripts and zero inline styles (Vite emits a module script and a
# stylesheet, both same-origin), and it talks only to its own /api prefix.
# =============================================================================

add_header X-Content-Type-Options    "nosniff"                    always;
add_header X-Frame-Options           "DENY"                       always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin"               always;
add_header Cross-Origin-Resource-Policy "same-origin"             always;
add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

# Two years, subdomains included, preload-eligible. Only ever sent over TLS.
add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;

add_header Content-Security-Policy
    "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests"
    always;
