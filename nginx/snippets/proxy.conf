# =============================================================================
# Shared reverse-proxy parameters.
#
# X-Forwarded-For is *overwritten*, not appended. The edge is the trust boundary:
# whatever a client claims about its own forwarding chain must be discarded here,
# otherwise `X-Forwarded-For: 1.2.3.4` from a browser would poison the client
# address that the API's login rate limiter keys on. With a single value there is
# also no ambiguity about which end of the list the ASGI server reads.
# =============================================================================

proxy_http_version 1.1;
# Required for upstream keepalive: the hop-by-hop header must not be forwarded.
proxy_set_header Connection        "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Forwarded-Port  $server_port;
# Propagated into the application's structlog context, so one request can be
# followed from the edge log into the application log.
proxy_set_header X-Request-ID      $request_id;

# Timeouts are deliberately NOT set here. nginx rejects a directive that appears
# twice in one context, so a location that needs a longer read timeout than the
# default could not override a value coming from this snippet. They are declared
# once at server level instead, where a location can legally override them.

# Answers are small JSON documents: buffer them so a slow client never occupies
# an upstream worker.
proxy_buffering       on;
proxy_buffers         8 16k;
proxy_buffer_size     16k;

# A backend that dies mid-request must not be retried blindly: a POST that
# created an invoice could otherwise be replayed. Only connection failures and
# timeouts before any byte was sent are safe to retry, and only on GET.
proxy_next_upstream   error timeout;
proxy_next_upstream_tries 2;
proxy_redirect        off;
