# =============================================================================
# Edge nginx — main configuration.
#
# This file replaces the image default so every production-relevant directive is
# visible in one auditable place. The server blocks live in
# /etc/nginx/templates/tgshop.conf.template, rendered by the official image's
# entrypoint (envsubst) so the domain is not baked into the image.
# =============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile  8192;

pid        /var/run/nginx.pid;
error_log  /var/log/nginx/error.log  warn;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Never advertise the version: it is free reconnaissance for an attacker.
    server_tokens  off;
    charset        utf-8;

    # ------------------------------- Logging --------------------------------- #
    # Structured logs, so the edge can be read by the same tooling as the
    # application's structlog output. $upstream_* fields make a slow backend
    # visible without guessing.
    log_format json_access escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$uri",'
          '"status":$status,'
          '"bytes_sent":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"upstream_addr":"$upstream_addr",'
          '"upstream_status":"$upstream_status",'
          '"upstream_time":"$upstream_response_time",'
          '"referer":"$http_referer",'
          '"user_agent":"$http_user_agent",'
          '"request_id":"$http_x_request_id"'
        '}';

    # Both paths are symlinks to the container's stdout/stderr in the official
    # image, so `docker compose logs nginx` shows everything.
    access_log  /var/log/nginx/access.log  json_access;

    # ------------------------------ Connections ------------------------------ #
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout    65s;
    keepalive_requests   1000;

    # Every request this deployment accepts is small JSON or a form login.
    # A 1 MB ceiling makes an upload-based memory attack impossible.
    client_max_body_size    1m;
    client_body_buffer_size 16k;
    client_body_timeout     15s;
    client_header_timeout   15s;
    send_timeout            30s;
    reset_timedout_connection on;

    types_hash_max_size     4096;
    server_names_hash_bucket_size 64;

    # --------------------------------- gzip ---------------------------------- #
    # Text only: images, fonts and archives are already compressed, and gzipping
    # them just burns CPU.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_disable      "msie6";
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ------------------------------ Rate limits ------------------------------ #
    # Declared here, applied only where it is genuinely needed (see the server
    # block). Provider webhooks are deliberately never limited: dropping a
    # payment notification costs money, and both webhooks are authenticated
    # cryptographically before anything is read.
    limit_req_zone  $binary_remote_addr  zone=login:10m  rate=10r/m;
    limit_req_zone  $binary_remote_addr  zone=api:10m    rate=20r/s;
    limit_conn_zone $binary_remote_addr  zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;
    # 429 is a normal outcome of a limit, not an incident: log it as a warning.
    limit_req_log_level  warn;
    limit_conn_log_level warn;

    include /etc/nginx/conf.d/*.conf;
}
