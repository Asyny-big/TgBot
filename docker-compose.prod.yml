# =============================================================================
# Production stack.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Deliberately a *standalone* file rather than an override of docker-compose.yml:
# an override would inherit the development bind mounts and the --reload flag,
# and a single forgotten `-f` would put a development container in production.
# Nothing here mounts source code; every service runs the code baked into its
# image.
#
# Differences from the development stack:
#   * no source mounts, no --reload, no development dependencies in the images;
#   * no published ports except the edge's 80/443 — PostgreSQL, Redis, the API
#     and the bot are unreachable from outside the Docker network;
#   * PostgreSQL and Redis sit on an `internal: true` network, so they have no
#     route to the internet at all;
#   * every long-running service restarts automatically and has a healthcheck;
#   * containers drop all capabilities, cannot gain new privileges, and the
#     stateless ones run with a read-only root filesystem;
#   * logs are size-capped, so a chatty day cannot fill the disk.
#
# Daily Content (daily-bot, daily-worker) sits behind the `daily` profile: a
# plain `up` leaves it alone, so the shop deploys exactly as before until
# COMPOSE_PROFILES=daily is set in .env. See docs/daily-content.md.
#
# PostgreSQL connection budget (max_connections=100, 3 reserved for superusers):
#   api           2 workers x (10 pool + 10 overflow)   40
#   bot           10 + 10                                20
#   daily-bot     5 + 5                                  10
#   daily-worker  5 + 5                                  10
#   peak                                                 80
# which leaves room for a migration run and an operator's psql session. A
# bigger pool anywhere, or more API workers, must be checked against it.
# =============================================================================
name: tgshop

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # --------------------------------------------------------------------------- #
  # PostgreSQL. Single source of truth for products, buyers and purchases.
  # --------------------------------------------------------------------------- #
  postgres:
    image: postgres:16-alpine
    restart: always
    <<: *hardening
    # Needs to bind its socket and chown its data directory during first init.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      # Sized for a small VPS; see README for how to scale these with the box.
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      # SSD-backed storage: random reads are not 4x more expensive than sequential.
      - -c
      - random_page_cost=1.1
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      # Slow statements are the first thing to look at when the panel drags.
      - -c
      - log_min_duration_statement=500
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Parallel query workers use /dev/shm; Docker's 64 MB default is too small.
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1g
    networks:
      - data

  # --------------------------------------------------------------------------- #
  # Redis. Distributed locks, login rate limiting and the revoked-refresh-token
  # list. That last one is why persistence is on: losing the list would make
  # every revoked refresh token acceptable again after a restart.
  # --------------------------------------------------------------------------- #
  redis:
    image: redis:7-alpine
    restart: always
    <<: *hardening
    # The entrypoint chowns /data and drops to the redis user before exec.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      # The data here is locks and revocations, never a disposable cache: an
      # eviction would silently break a guarantee, so a write must fail loudly.
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384m
    networks:
      - data

  # --------------------------------------------------------------------------- #
  # Schema migrations. Runs to completion before the API and the bot start, so
  # neither can ever talk to an outdated schema. `restart: no` is deliberate: a
  # one-shot job that restarts forever would never satisfy its own gate.
  # --------------------------------------------------------------------------- #
  migrations:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: tgshop-backend:latest
    restart: "no"
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ["alembic", "upgrade", "head"]
    # One-shot job: the inherited image healthcheck targets the API port
    # and would only add noise to `docker compose ps`.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging
    networks:
      - data

  # --------------------------------------------------------------------------- #
  # Admin API. Reachable only through the edge.
  # --------------------------------------------------------------------------- #
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: tgshop-backend:latest
    restart: always
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    # --proxy-headers makes the client address come from the edge's
    # X-Forwarded-For, which nginx overwrites with the real peer, so a browser
    # cannot forge the address the login rate limiter keys on. The API publishes
    # no port, so nginx is the only thing that can reach it.
    command:
      - uvicorn
      - app.asgi:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "${API_WORKERS:-2}"
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
      - --no-server-header
      - --timeout-graceful-shutdown
      - "20"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    stop_grace_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768m
    networks:
      - data
      - edge

  # --------------------------------------------------------------------------- #
  # Bot. Owns the Telegram webhook, the Crypto Pay webhook, delivery, and the
  # reconciliation and housekeeping loops.
  #
  # MUST stay at exactly one replica: Telegram delivers each update once, and a
  # second reconciliation loop would double the provider polling for no gain.
  # --------------------------------------------------------------------------- #
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: tgshop-backend:latest
    restart: always
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ["python", "-m", "app.bot"]
    # The image's healthcheck probes the API's port; the bot serves its own
    # liveness route instead, on the port nginx forwards webhooks to.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/internal/health', timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    # Long enough for an in-flight delivery retry chain to finish after SIGTERM.
    stop_grace_period: 45s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512m
    networks:
      - data
      - edge

  # --------------------------------------------------------------------------- #
  # Daily Content bot: its own Telegram bot, on its own webhook (nginx forwards
  # /webhook/daily to port 8082). Talks to buyers and to the owner, and runs the
  # watchdog of the worker — from this container, so a dead worker cannot hide
  # its own death.
  #
  # MUST stay at exactly one replica: Telegram delivers each update once.
  # --------------------------------------------------------------------------- #
  daily-bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: tgshop-backend:latest
    profiles:
      - daily
    restart: always
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      # Pinned here, not in .env: nginx forwards exactly this path to exactly
      # this port, and the health check below probes it.
      DAILY_USE_WEBHOOK: "true"
      DAILY_WEBHOOK_PATH: /webhook/daily
      DAILY_BOT_HOST: 0.0.0.0
      DAILY_BOT_PORT: "8082"
      # Its share of the connection budget at the top of this file.
      POSTGRES_POOL_SIZE: "5"
      POSTGRES_MAX_OVERFLOW: "5"
    command: ["python", "-m", "app.daily_bot"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8082/internal/health', timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    # The webhook server stops accepting, the album answers in flight go out.
    stop_grace_period: 30s
    logging: *logging
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 384m
    networks:
      - data
      - edge

  # --------------------------------------------------------------------------- #
  # Daily Content worker: plans and sends the daily deliveries, the outbox
  # (alerts, answers, "send it to me"), closes what expired, raises the owner's
  # alerts, and writes the heartbeat the daily-bot's watchdog reads. Serves only
  # its health check, on 8083, to nobody but Docker.
  #
  # MUST stay at exactly one replica: the sending budget (Telegram's rate limit)
  # is per process. Its leases make a second one safe, never faster.
  # --------------------------------------------------------------------------- #
  daily-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: tgshop-backend:latest
    profiles:
      - daily
    restart: always
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DAILY_WORKER_HOST: 0.0.0.0
      DAILY_WORKER_PORT: "8083"
      POSTGRES_POOL_SIZE: "5"
      POSTGRES_MAX_OVERFLOW: "5"
    command: ["python", "-m", "app.daily_worker"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8083/internal/health', timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    # SIGTERM lets every loop finish the pass it is in (25 s), then it exits:
    # no lease is left behind by a deploy.
    stop_grace_period: 30s
    logging: *logging
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.50"
          memory: 384m
    networks:
      - data
      # Outbound HTTPS to Telegram; nothing reaches it from here.
      - edge

  # --------------------------------------------------------------------------- #
  # Edge: TLS termination, security headers, gzip, static panel, routing.
  # The only service with published ports.
  #
  # It deliberately does not depend on daily-bot: the shop's edge must start,
  # and keep working, whether Daily Content is deployed or not.
  # --------------------------------------------------------------------------- #
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      target: runtime
    image: tgshop-edge:latest
    restart: always
    <<: *hardening
    # The master process binds 80/443 and drops to the nginx user for workers.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    environment:
      TGSHOP_DOMAIN: ${TGSHOP_DOMAIN:?TGSHOP_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      api:
        condition: service_healthy
      bot:
        condition: service_healthy
    stop_grace_period: 20s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256m
    networks:
      - edge

  # --------------------------------------------------------------------------- #
  # Certificate issuance and renewal. Never started by `up`: it is a one-shot
  # tool, driven by scripts/tls-init.sh and scripts/renew-certs.sh (cron).
  # A long-running sleep-loop container would hide failures instead of reporting
  # them to whoever scheduled the renewal.
  # --------------------------------------------------------------------------- #
  certbot:
    image: certbot/certbot:latest
    profiles:
      - tools
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    logging: *logging
    networks:
      - edge

volumes:
  postgres_data:
  redis_data:
  letsencrypt:
  certbot_webroot:

networks:
  # Data plane: no gateway, so PostgreSQL and Redis cannot reach the internet
  # and the internet cannot reach them.
  data:
    driver: bridge
    internal: true
  # Front plane: the edge, plus the two services it proxies to. The API and the
  # bot need outbound HTTPS (Telegram, Crypto Pay), which they get here.
  edge:
    driver: bridge
